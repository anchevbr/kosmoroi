[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "greek-news-backend"
version = "0.2.0"
description = "HTML-only Greek and worldwide news backend with local AI"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic==1.15.2",
    "celery[redis]==5.5.2",
    "cssselect==1.3.0",
    "fastapi==0.115.12",
    "geonamescache==3.0.2",
    "pycountry==24.6.1",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "pydantic==2.14.0",
    "pydantic-settings==2.8.1",
    "psycopg[binary]==3.2.6",
    "python-dateutil==2.9.0.post0",
    "sqlalchemy==2.0.40",
    "trafilatura==2.0.0",
    "uvicorn==0.34.2",
]

[project.optional-dependencies]
local-ai = ["llama-cpp-python==0.3.36"]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.6",
]

[project.scripts]
greek-news = "greek_news.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
