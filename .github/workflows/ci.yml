name: backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kosmoroi_test
          POSTGRES_USER: news
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U news -d kosmoroi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install '.[dev]'
      - run: ruff check src tests alembic
      - run: pytest -q
        env:
          NEWS_TEST_POSTGRES_URL: postgresql+psycopg://news:test-password@localhost:5432/kosmoroi_test
      - run: alembic upgrade head && alembic check
        env:
          NEWS_DATABASE_URL: postgresql+psycopg://news:test-password@localhost:5432/kosmoroi_test
      - run: cp .env.example .env && docker compose --env-file .env.example config --quiet
      - run: docker build -t kosmoroi-backend .
